name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pytest
        run: uv run pytest

  deploy:
    name: Desplegar en Render
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.HOOK_RENDER_BACKEND }}
    steps:
      - name: Llamar al Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK_URL"
