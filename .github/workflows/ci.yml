name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pytest
        run: uv run pytest

  deploy:
    name: Desplegar en Render
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
